<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 Chat Pro</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e1e1e;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:10px;
    margin:5px 0;
    border-radius:8px;
    border:none;
    background:#2a2a2a;
    color:white;
}

button{
    width:100%;
    padding:10px;
    margin-top:5px;
    background:#2196f3;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
}

.chat{
    height:250px;
    overflow:auto;
    background:#181818;
    padding:10px;
    border-radius:10px;
}

.msg{
    background:#2a2a2a;
    padding:8px;
    margin:5px 0;
    border-radius:8px;
}

.online{
    color:#90caf9;
    font-size:14px;
}

.admin{
    display:none;
    background:#2c2c2c;
    padding:10px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div class="card" id="auth">
<h2>Login / Register</h2>

<input id="user" placeholder="Kullanıcı adı">
<input id="pass" type="password" placeholder="Şifre">

<button onclick="register()">Kayıt Ol</button>
<button onclick="login()">Giriş Yap</button>
</div>

<!-- CHAT -->
<div class="card" id="chat" style="display:none;">

<h2>ESP32 CHAT</h2>

<p id="welcome"></p>
<p class="online" id="onlineUsers"></p>

<div class="chat" id="chatBox"></div>

<input id="msg" placeholder="Mesaj">
<button onclick="send()">Gönder</button>

<!-- ADMIN PANEL -->
<div class="admin" id="adminPanel">
<h3>👑 ADMIN PANEL</h3>

<input id="targetUser" placeholder="Kullanıcı adı">

<button onclick="banUser()">🚫 Ban</button>
<button onclick="unbanUser()">✅ Ban Aç</button>

<button onclick="muteUser()">🔇 Mute</button>
<button onclick="unmuteUser()">🔊 Mute Aç</button>

<button onclick="clearChat()">🧹 Sohbet Sıfırla</button>

<h3>📜 LOG</h3>
<div id="logBox" style="max-height:150px;overflow:auto;background:#111;padding:10px;border-radius:8px;"></div>
</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
onSnapshot,
doc,
setDoc,
getDocs,
query,
orderBy,
deleteDoc
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

// FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "esp-chat-9ab3c.firebaseapp.com",
  projectId: "esp-chat-9ab3c",
  storageBucket: "esp-chat-9ab3c.appspot.com",
  messagingSenderId: "976211041701",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUser = null;
let isMuted = false;
let isBanned = false;
let isAdmin = false;

/* ================= REGISTER ================= */
window.register = async function(){
    await setDoc(doc(db,"users",user.value),{
        pass: pass.value
    });
    alert("Kayıt başarılı");
}

/* ================= LOGIN ================= */
window.login = async function(){

    isMuted = false;
    isBanned = false;
    isAdmin = false;

    let snap = await getDocs(collection(db,"users"));

    let ok = false;

    snap.forEach(d=>{
        if(d.id===user.value && d.data().pass===pass.value){
            ok = true;
        }
    });

    if(!ok){
        alert("Hatalı giriş");
        return;
    }

    currentUser = user.value;

    // BAN
    const banSnap = await getDocs(collection(db,"banned"));
    banSnap.forEach(d=>{
        if(d.id === currentUser) isBanned = true;
    });

    if(isBanned){
        alert("BANLANDIN ❌");
        return;
    }

    // MUTE
    const muteSnap = await getDocs(collection(db,"muted"));
    muteSnap.forEach(d=>{
        if(d.id === currentUser) isMuted = true;
    });

    // ADMIN
    const adminSnap = await getDocs(collection(db,"admins"));
    adminSnap.forEach(d=>{
        if(d.id === currentUser) isAdmin = true;
    });

    auth.style.display="none";
    chat.style.display="block";

    welcome.innerText="Hoşgeldin " + currentUser;

    if(isAdmin){
        adminPanel.style.display="block";
        listenLogs();
    }

    setOnline();
    listenChat();
    listenOnline();

    setInterval(setOnline,5000);
}

/* ================= SEND ================= */
window.send = async function(){

    if(isBanned) return alert("Banlısın");
    if(isMuted) return alert("Mute yedin");

    if(!msg.value) return;

    await addDoc(collection(db,"messages"),{
        user:currentUser,
        text:msg.value,
        time:Date.now()
    });

    msg.value="";
}

/* ================= CHAT ================= */
function listenChat(){

    const q = query(collection(db,"messages"),orderBy("time"));

    onSnapshot(q,(snap)=>{

        chatBox.innerHTML="";

        snap.forEach(d=>{
            let m=d.data();

            let div=document.createElement("div");
            div.className="msg";
            div.innerHTML="<b>"+m.user+":</b> "+m.text;

            chatBox.appendChild(div);
        });

    });
}

/* ================= ONLINE ================= */
function setOnline(){
    setDoc(doc(db,"online",currentUser),{
        time:Date.now()
    });
}

function listenOnline(){

    onSnapshot(collection(db,"online"),(snap)=>{

        let list="Online: ";

        snap.forEach(d=>{
            let diff = Date.now() - d.data().time;
            if(diff<10000) list += d.id + " ";
        });

        onlineUsers.innerText=list;

    });

}

/* ================= LOG ================= */
async function addLog(action,target){

    await addDoc(collection(db,"admin_logs"),{
        action:action,
        by:currentUser,
        target:target,
        time:Date.now()
    });
}

function listenLogs(){

    onSnapshot(collection(db,"admin_logs"),(snap)=>{

        logBox.innerHTML="";

        snap.forEach(d=>{
            let l=d.data();

            let div=document.createElement("div");
            div.className="msg";
            div.innerHTML="👑 "+l.by+" → "+l.action+" → "+l.target;

            logBox.appendChild(div);
        });

    });
}

/* ================= ADMIN ================= */

// BAN
window.banUser = async function(){
    await setDoc(doc(db,"banned",targetUser.value),{time:Date.now()});
    await addLog("BAN",targetUser.value);
}

// UNBAN
window.unbanUser = async function(){
    await deleteDoc(doc(db,"banned",targetUser.value));
    await addLog("UNBAN",targetUser.value);
}

// MUTE
window.muteUser = async function(){
    await setDoc(doc(db,"muted",targetUser.value),{time:Date.now()});
    await addLog("MUTE",targetUser.value);
}

// UNMUTE
window.unmuteUser = async function(){
    await deleteDoc(doc(db,"muted",targetUser.value));
    await addLog("UNMUTE",targetUser.value);
}

// CLEAR CHAT
window.clearChat = async function(){

    const snap = await getDocs(collection(db,"messages"));

    const promises=[];

    snap.forEach(d=>{
        promises.push(deleteDoc(doc(db,"messages",d.id)));
    });

    await Promise.all(promises);

    await addLog("CLEAR_CHAT","ALL");
}

</script>

</body>
</html>
