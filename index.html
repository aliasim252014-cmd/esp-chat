<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Firebase Chat</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#36393f;
    color:white;
}

/* LOGIN */
#auth{
    max-width:400px;
    margin:80px auto;
    background:#2f3136;
    padding:20px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    margin:5px 0;
    border:none;
    border-radius:6px;
    background:#202225;
    color:white;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:6px;
    background:#5865f2;
    color:white;
    cursor:pointer;
}

/* APP */
#app{
    display:none;
    height:100vh;
}

.app{
    display:flex;
    height:100%;
}

/* SIDEBAR */
.sidebar{
    width:220px;
    background:#2f3136;
    padding:10px;
}

.channel{
    padding:10px;
    margin:5px 0;
    background:#40444b;
    border-radius:6px;
    cursor:pointer;
}

/* CHAT */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

.topbar{
    background:#2f3136;
    padding:10px;
    display:flex;
    justify-content:space-between;
}

.chat{
    flex:1;
    padding:10px;
    overflow:auto;
}

.msg{
    background:#40444b;
    padding:8px;
    margin:5px 0;
    border-radius:6px;
}

/* INPUT */
.inputArea{
    display:flex;
    padding:10px;
    background:#2f3136;
}

.inputArea input{
    flex:1;
}

.inputArea button{
    width:120px;
    margin-left:10px;
}

/* ONLINE */
.users{
    width:200px;
    background:#2f3136;
    padding:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="auth">
<h2>Login / Register</h2>

<input id="user" placeholder="Kullanıcı adı">
<input id="pass" type="password" placeholder="Şifre">

<button onclick="register()">Kayıt Ol</button>
<button onclick="login()">Giriş Yap</button>

<p id="msg"></p>
</div>

<!-- APP -->
<div id="app">

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
<h3># Kanallar</h3>
<div class="channel">genel</div>
</div>

<!-- CHAT -->
<div class="main">

<div class="topbar">
<span># genel</span>
<span id="onlineUsers"></span>
</div>

<div class="chat" id="chatBox"></div>

<div class="inputArea">
<input id="msgInput" placeholder="Mesaj yaz...">
<button onclick="send()">Gönder</button>
</div>

</div>

<!-- ONLINE -->
<div class="users">
<h3>🟢 Online</h3>
<div id="userList"></div>
</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
onSnapshot,
doc,
setDoc,
getDocs,
query,
orderBy
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAvdGhWk1QOBlvPYOLt8ajTFwAGYsUx1ps",
  authDomain: "esp-chat-9ab3c.firebaseapp.com",
  projectId: "esp-chat-9ab3c",
  storageBucket: "esp-chat-9ab3c.appspot.com",
  messagingSenderId: "976211041701",
  appId: "1:976211041701:web:2891ba81390dd08fc1dc4c"
};

const appFirebase = initializeApp(firebaseConfig);
const db = getFirestore(appFirebase);

let currentUser = null;

/* REGISTER */
window.register = async function(){

    if(!user.value || !pass.value){
        msg.innerText = "Boş bırakma ❌";
        return;
    }

    await setDoc(doc(db,"users",user.value),{
        pass: pass.value
    });

    msg.innerText = "Kayıt başarılı ✔";
}

/* LOGIN */
window.login = async function(){

    const snap = await getDocs(collection(db,"users"));

    let ok = false;

    snap.forEach(d=>{
        if(d.id===user.value && d.data().pass===pass.value){
            ok = true;
        }
    });

    if(!ok){
        msg.innerText = "Hatalı giriş ❌";
        return;
    }

    currentUser = user.value;

    auth.style.display = "none";
    app.style.display = "block";

    setOnline();
    listenChat();
    listenOnline();

    setInterval(setOnline,5000);
}

/* SEND */
window.send = async function(){

    if(!msgInput.value) return;

    await addDoc(collection(db,"messages"),{
        user: currentUser,
        text: msgInput.value,
        room: "genel",
        time: Date.now()
    });

    msgInput.value = "";
}

/* CHAT */
function listenChat(){

    const q = query(collection(db,"messages"),orderBy("time"));

    onSnapshot(q,(snap)=>{

        chatBox.innerHTML="";

        snap.forEach(d=>{
            let m=d.data();

            if(m.room!=="genel") return;

            let div=document.createElement("div");
            div.className="msg";

            div.innerHTML=`<b>${m.user}:</b> ${m.text}`;

            chatBox.appendChild(div);
        });

    });
}

/* ONLINE */
function setOnline(){
    setDoc(doc(db,"online",currentUser),{
        time: Date.now()
    });
}

function listenOnline(){

    onSnapshot(collection(db,"online"),(snap)=>{

        userList.innerHTML="";
        let list="";

        snap.forEach(d=>{
            let diff = Date.now()-d.data().time;

            if(diff<10000){
                list += d.id+" ";

                let div=document.createElement("div");
                div.innerText=d.id;
                userList.appendChild(div);
            }
        });

        onlineUsers.innerText="Online: "+list;

    });
}

</script>

</body>
</html>
