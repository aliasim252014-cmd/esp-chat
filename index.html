<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 Modern Chat</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e1e1e;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:10px;
    margin:5px 0;
    border-radius:8px;
    border:none;
    background:#2a2a2a;
    color:white;
}

button{
    width:100%;
    padding:10px;
    background:#2196f3;
    color:white;
    border:none;
    border-radius:8px;
    margin-top:5px;
    cursor:pointer;
}

.chat{
    height:250px;
    overflow:auto;
    background:#181818;
    padding:10px;
    border-radius:10px;
}

.msg{
    background:#2a2a2a;
    padding:8px;
    margin:5px 0;
    border-radius:8px;
}

.online{
    font-size:14px;
    color:#90caf9;
}

.admin{
    display:none;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div class="card" id="auth">
<h2>Login / Register</h2>

<input id="user" placeholder="Kullanıcı adı">
<input id="pass" type="password" placeholder="Şifre">

<button onclick="register()">Kayıt Ol</button>
<button onclick="login()">Giriş Yap</button>
</div>

<!-- CHAT -->
<div class="card" id="chat" style="display:none;">

<h2>ESP32 CHAT</h2>

<p id="welcome"></p>
<p class="online" id="onlineUsers"></p>

<div class="chat" id="chatBox"></div>

<input id="msg" placeholder="Mesaj">
<button onclick="send()">Gönder</button>

<div class="admin" id="adminPanel">
<h3>ADMIN PANEL</h3>
<button onclick="alert('Ban sistemi backend gerekir')">Ban</button>
</div>

</div>

</div>

<!-- FIREBASE MODERN MODULE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyAvdGhWk1QOBlvPYOLt8ajTFwAGYsUx1ps",
  authDomain: "esp-chat-9ab3c.firebaseapp.com",
  projectId: "esp-chat-9ab3c",
  storageBucket: "esp-chat-9ab3c.appspot.com",
  messagingSenderId: "976211041701",
  appId: "1:976211041701:web:2891ba81390dd08fc1dc4c"
};

// INIT
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// GLOBAL
let currentUser = null;

// REGISTER
window.register = async function(){
    let u = user.value;
    let p = pass.value;

    await setDoc(doc(db,"users",u),{
        pass:p
    });

    alert("Kayıt başarılı");
}

// LOGIN
window.login = async function(){
    let u = user.value;
    let p = pass.value;

    let snap = await getDocs(collection(db,"users"));

    let ok = false;

    snap.forEach(d=>{
        if(d.id === u && d.data().pass === p){
            ok = true;
        }
    });

    if(!ok){
        alert("Hatalı giriş");
        return;
    }

    currentUser = u;

    auth.style.display="none";
    chat.style.display="block";

    welcome.innerText="Hoşgeldin " + u;

    if(u === "aliasim"){
        adminPanel.style.display="block";
    }

    setOnline(u);
    listenChat();
    listenOnline();
}

// SEND MESSAGE
window.send = async function(){
    if(!msg.value) return;

    await addDoc(collection(db,"messages"),{
        user:currentUser,
        text:msg.value,
        time:Date.now()
    });

    msg.value="";
}

// CHAT REALTIME
function listenChat(){
    onSnapshot(collection(db,"messages"),(snap)=>{
        chatBox.innerHTML="";

        snap.forEach(d=>{
            let x=d.data();

            let div=document.createElement("div");
            div.className="msg";
            div.innerHTML="<b>"+x.user+":</b> "+x.text;

            chatBox.appendChild(div);
        });
    });
}

// ONLINE SYSTEM
function setOnline(u){
    setDoc(doc(db,"online",u),{
        time:Date.now()
    });
}

function listenOnline(){
    onSnapshot(collection(db,"online"),(snap)=>{
        let list="Online: ";

        snap.forEach(d=>{
            list += d.id + " ";
        });

        onlineUsers.innerText=list;
    });
}

</script>

</body>
</html>
