<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 Online Chat</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e1e1e;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:10px;
    margin:5px 0;
    border-radius:8px;
    border:none;
    background:#2a2a2a;
    color:white;
}

button{
    width:100%;
    padding:10px;
    background:#2196f3;
    color:white;
    border:none;
    border-radius:8px;
    margin-top:5px;
    cursor:pointer;
}

.chat{
    height:250px;
    overflow:auto;
    background:#181818;
    padding:10px;
    border-radius:10px;
}

.msg{
    padding:8px;
    margin:5px 0;
    background:#2a2a2a;
    border-radius:8px;
}

.admin{
    display:none;
}

.online{
    font-size:14px;
    color:#90caf9;
}
</style>
</head>

<body>

<div class="container">

<!-- AUTH -->
<div class="card" id="auth">
<h2>Login / Register</h2>

<input id="user" placeholder="Kullanıcı adı">
<input id="pass" type="password" placeholder="Şifre">

<button onclick="register()">Kayıt Ol</button>
<button onclick="login()">Giriş Yap</button>
</div>

<!-- CHAT -->
<div class="card" id="chat" style="display:none;">

<h2>ESP32 CHAT</h2>
<p id="welcome"></p>

<p class="online" id="onlineUsers"></p>

<div class="chat" id="chatBox"></div>

<input id="msg" placeholder="Mesaj">
<button onclick="send()">Gönder</button>

<!-- ADMIN -->
<div class="admin" id="adminPanel">
<h3>ADMIN PANEL</h3>

<button onclick="act('ban')">Ban</button>
<button onclick="act('unban')">Unban</button>
<button onclick="act('mute')">Mute</button>
<button onclick="act('unmute')">Unmute</button>
</div>

</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "API_KEY",
  authDomain: "PROJECT.firebaseapp.com",
  projectId: "PROJECT",
  storageBucket: "PROJECT.appspot.com",
  messagingSenderId: "ID",
  appId: "APP_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// USERS CACHE
let currentUser = null;
let banned = [];
let muted = [];
let online = {};

// REGISTER
function register(){
    let u = user.value;
    let p = pass.value;

    db.collection("users").doc(u).set({
        pass:p
    });

    alert("Kayıt başarılı");
}

// LOGIN
function login(){
    let u = user.value;
    let p = pass.value;

    db.collection("users").doc(u).get().then(doc=>{
        if(!doc.exists) return alert("Kullanıcı yok");

        if(doc.data().pass !== p) return alert("Şifre yanlış");

        currentUser = u;

        auth.style.display="none";
        chat.style.display="block";

        welcome.innerText="Hoşgeldin " + u;

        if(u === "aliasim"){
            adminPanel.style.display="block";
        }

        setOnline(u);
        listenMessages();
        listenOnline();
    });
}

// ONLINE SYSTEM
function setOnline(u){
    db.collection("online").doc(u).set({
        time:Date.now()
    });
}

// CHAT SEND
function send(){
    let m = msg.value;

    db.collection("messages").add({
        user:currentUser,
        text:m,
        time:Date.now()
    });

    msg.value="";
}

// REALTIME MESSAGES
function listenMessages(){
    db.collection("messages")
    .orderBy("time")
    .onSnapshot(snap=>{
        chatBox.innerHTML="";
        snap.forEach(d=>{
            let x=d.data();

            let div=document.createElement("div");
            div.className="msg";
            div.innerHTML="<b>"+x.user+":</b> "+x.text;

            chatBox.appendChild(div);
        });
    });
}

// ONLINE USERS
function listenOnline(){
    db.collection("online")
    .onSnapshot(snap=>{
        let list="Online: ";
        snap.forEach(d=>{
            list += d.id + " ";
        });
        onlineUsers.innerText=list;
    });
}

// ADMIN ACTION
function act(type){
    let u=prompt("Kullanıcı");

    if(currentUser!=="aliasim")return;

    db.collection("control").add({
        type:type,
        user:u
    });

    alert("İşlem gönderildi");
}
</script>

</body>
</html>
