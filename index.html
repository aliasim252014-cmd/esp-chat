<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Chat</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
}

.container{max-width:900px;margin:auto;padding:20px;}

.card{
    background:#1e1e1e;
    padding:15px;
    border-radius:10px;
    margin-bottom:10px;
}

input,button{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:8px;
    border:none;
}

button{
    background:#2196f3;
    color:white;
    cursor:pointer;
}

.chat{
    height:250px;
    overflow:auto;
    background:#181818;
    padding:10px;
    border-radius:10px;
}

.msg{
    background:#2a2a2a;
    margin:5px 0;
    padding:8px;
    border-radius:8px;
}

.row{
    display:flex;
    gap:5px;
}

.row button{
    flex:1;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div class="card" id="auth">
<h2>Login</h2>

<input id="user" placeholder="kullanıcı">
<input id="pass" type="password" placeholder="şifre">

<button onclick="register()">Kayıt</button>
<button onclick="login()">Giriş</button>

<p id="msgAuth"></p>
</div>

<!-- CHAT -->
<div class="card" id="chat" style="display:none;">

<h2>Room Chat</h2>

<p id="welcome"></p>

<!-- ROOM -->
<div class="row">
<input id="roomName" placeholder="oda adı">
<button onclick="createRoom()">Oda Oluştur</button>
</div>

<p id="currentRoom">Oda: genel</p>

<div id="roomList"></div>

<!-- CHAT -->
<div class="chat" id="chatBox"></div>

<input id="msg" placeholder="mesaj">
<button onclick="send()">Gönder</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
onSnapshot,
doc,
setDoc,
getDocs,
query,
orderBy
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "esp-chat.firebaseapp.com",
  projectId: "esp-chat",
  storageBucket: "esp-chat.appspot.com",
  messagingSenderId: "000",
  appId: "000"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUser = null;
let currentRoom = "genel";

/* REGISTER */
window.register = async function(){
    await setDoc(doc(db,"users",user.value),{
        pass: pass.value
    });
    msgAuth.innerText="Kayıt başarılı";
}

/* LOGIN */
window.login = async function(){

    const snap = await getDocs(collection(db,"users"));

    let ok=false;

    snap.forEach(d=>{
        if(d.id===user.value && d.data().pass===pass.value){
            ok=true;
        }
    });

    if(!ok){
        msgAuth.innerText="hatalı giriş";
        return;
    }

    currentUser=user.value;

    auth.style.display="none";
    chat.style.display="block";

    welcome.innerText="Hoşgeldin "+currentUser;

    loadRooms();
    listenChat();
}

/* ROOM CREATE */
window.createRoom = async function(){

    if(!roomName.value) return;

    await setDoc(doc(db,"rooms",roomName.value),{});

    loadRooms();
}

/* LOAD ROOMS */
function loadRooms(){

    onSnapshot(collection(db,"rooms"),(snap)=>{

        roomList.innerHTML="";

        snap.forEach(d=>{

            let btn=document.createElement("button");
            btn.innerText=d.id;

            btn.onclick=()=>{
                currentRoom=d.id;
                currentRoomText.innerText="Oda: "+currentRoom;
                listenChat();
            };

            roomList.appendChild(btn);
        });

    });

}

/* SEND MESSAGE */
window.send = async function(){

    if(!msg.value) return;

    await addDoc(collection(db,"messages"),{
        room: currentRoom,
        user: currentUser,
        text: msg.value,
        time: Date.now()
    });

    msg.value="";
}

/* CHAT LISTENER */
function listenChat(){

    const q = query(collection(db,"messages"),orderBy("time"));

    onSnapshot(q,(snap)=>{

        chatBox.innerHTML="";

        snap.forEach(d=>{

            let m=d.data();

            if(m.room===currentRoom){

                let div=document.createElement("div");
                div.className="msg";

                div.innerHTML="<b>"+m.user+":</b> "+m.text;

                chatBox.appendChild(div);
            }

        });

    });

}

</script>

</body>
</html>
